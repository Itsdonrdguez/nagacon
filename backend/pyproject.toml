[project]
name = "nagacon-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "openai>=1.30",
  "requests>=2.31",
  "rapidfuzz>=3.9",
  "pymupdf>=1.24",
  "pdfplumber>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
